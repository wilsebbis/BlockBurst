<!doctype html>
<html lang="en" class="cozy-root">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5ebe3" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Block Burst: drag cozy blocks onto an 8x8 board and clear lines, level after level. Rescue the blobs to your Sanctuary, and visit the Penguin Exhibit." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Block Burst</title>
  </head>
  <body>
    <div id="root">
      <!-- Skeleton shown until the app hydrates: the same shape as the home screen, so nothing jumps. -->
      <div style="min-height:100%;display:flex;flex-direction:column;align-items:center;gap:16px;padding:64px 16px;background:#f5ebe3">
        <div style="width:220px;height:56px;border-radius:16px;background:rgba(160,138,120,.18)"></div>
        <div style="width:min(92vw,360px);height:72px;border-radius:9999px;background:rgba(160,138,120,.35)"></div>
        <div style="width:min(92vw,360px);height:64px;border-radius:9999px;background:rgba(160,138,120,.18)"></div>
        <div style="width:min(92vw,360px);height:64px;border-radius:9999px;background:rgba(160,138,120,.18)"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
